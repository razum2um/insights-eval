[project]
name = "insights-eval"
version = "0.1.0"
description = "Inspect eval — does an LLM agent honestly fill the insights MCP server's audit-trail field?"
requires-python = ">=3.12,<3.14"
dependencies = [
    "inspect-ai>=0.3.120",
    "asyncpg>=0.30",
    "mcp>=1.27.1",
    "openai>=2.37.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["insights_eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
